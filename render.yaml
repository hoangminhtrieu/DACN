services:
  - type: web
    name: urban-plants-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: urban-plants-db
          property: connectionString

databases:
  - name: urban-plants-db
    databaseName: urban_plants
    user: urban_plants_user
    plan: free
