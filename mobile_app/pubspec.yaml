name: urban_plants
description: "Urban Plants - Smart Urban Gardening & AI Plant Disease Diagnosis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  image_picker: ^1.0.7
  tflite_flutter: ^0.10.4
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_messaging: ^14.7.19
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  uuid: ^4.3.3
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
