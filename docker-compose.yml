version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: urban_plants_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: urban_plants_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: urban_plants_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_plants_backend
    restart: always
    env_file:
      - ./backend/.env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/urban_plants_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
