name: Urban Plants CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: urban_plants_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          cd backend
          flake8 app/ --count --max-line-length=120 --statistics --ignore=E203,W503

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/urban_plants_test_db
          DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@localhost:5432/urban_plants_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci-cd
        run: |
          cd backend
          pytest tests/ -v

  mobile-lint:
    name: Flutter Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd mobile_app
          flutter analyze
